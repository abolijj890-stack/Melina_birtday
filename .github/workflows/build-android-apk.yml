name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kol-zendegi-man-android-project.zip'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q kol-zendegi-man-android-project.zip -d /tmp/android-project
          PROJECT_DIR=$(dirname "$(find /tmp/android-project -name settings.gradle -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "Android project files not found"
            exit 1
          fi
          mkdir -p android-app
          cp -a "$PROJECT_DIR"/. android-app/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kol-zendegi-man-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
