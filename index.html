<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تولد ملینا ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffe6f0;
    font-family: sans-serif;
    text-align: center;
    overflow-x: hidden;
}


/* =========================
   صفحه شمارش
========================= */

#countdownScreen {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #ffe6f0;

    z-index: 9999;
}


#countdown {

    display: flex;
    direction: rtl;

    justify-content: center;
    align-items: center;

    gap: 10px;
}


/* هر قسمت */

.count-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;
}


/* باکس عدد */

.count-box {

    width: 75px;
    height: 90px;

    display: flex;

    justify-content: center;
    align-items: center;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 10px 30px
        rgba(233, 30, 99, 0.15);

    animation:
        floating 2s ease-in-out infinite;
}


.count-box span {

    font-size: 34px;

    font-weight: bold;

    color: #e91e63;
}


/* اسم زیر عدد */

.count-item small {

    color: #ad1457;

    font-size: 14px;

    font-weight: bold;
}


/* انیمیشن */

@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }

}


/* =========================
   محتوای تولد
========================= */

#mainContent {
    display: none;
}


.card {

    background: white;

    width: 85%;
    max-width: 500px;

    margin: 50px auto;

    padding: 30px;

    border-radius: 25px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.15);
}


h1 {
    color: #e91e63;
    font-size: 35px;
}


h2 {
    color: #ad1457;
}


p {
    color: #444;

    font-size: 18px;

    line-height: 1.8;
}


/* =========================
   قلب‌ها
========================= */

.heart {

    position: fixed;

    bottom: -50px;

    font-size: 25px;

    animation:
        floatHeart 5s linear infinite;

    pointer-events: none;
}


@keyframes floatHeart {

    0% {
        transform: translateY(0);
        opacity: 1;
    }

    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }

}


/* قلب‌های سورپرایز */

.falling-heart {

    position: fixed;

    top: -50px;

    font-size: 30px;

    animation:
        fallHeart 4s linear forwards;

    z-index: 999;

    pointer-events: none;
}


@keyframes fallHeart {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg);

        opacity: 0;
    }

}


/* =========================
   دکمه
========================= */

button {

    background: #e91e63;

    color: white;

    border: none;

    padding: 15px 25px;

    border-radius: 30px;

    font-size: 18px;

    cursor: pointer;

    margin-top: 20px;
}


button:active {
    transform: scale(0.95);
}


/* =========================
   ویس
========================= */

#audioBox {
    margin-top: 25px;
}


audio {
    width: 100%;
}


/* =========================
   موبایل
========================= */

@media (max-width: 400px) {

    #countdown {
        gap: 6px;
    }

    .count-box {
        width: 65px;
        height: 80px;
    }

    .count-box span {
        font-size: 29px;
    }

    .count-item small {
        font-size: 12px;
    }

}

</style>

</head>


<body>


<!-- =========================
     شمارش معکوس
========================= -->

<div id="countdownScreen">

    <div id="countdown">


        <div class="count-item">

            <div class="count-box">
                <span id="days">00</span>
            </div>

            <small>روز</small>

        </div>


        <div class="count-item">

            <div class="count-box">
                <span id="hours">00</span>
            </div>

            <small>ساعت</small>

        </div>


        <div class="count-item">

            <div class="count-box">
                <span id="minutes">00</span>
            </div>

            <small>دقیقه</small>

        </div>


        <div class="count-item">

            <div class="count-box">
                <span id="seconds">00</span>
            </div>

            <small>ثانیه</small>

        </div>


    </div>

</div>



<!-- =========================
     محتوای تولد
========================= -->

<div id="mainContent">


    <div class="heart">❤️</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💖</div>


    <div class="card">


        <h1>
            تولدت مبارک ملینا ❤️
        </h1>


        <h2>
            تو قشنگ ترین اتفاق زندگی منی
        </h2>


        <p>

            امروز فقط یک روز معمولی نیست؛

            <br>

            روزیه که بهترین آدم زندگیم
            به دنیا اومد. ❤️

        </p>


        <div id="audioBox">

            <p>
                اینم چیزی که برای تو گذاشتم ❤️🎧
            </p>

            <audio
                controls
                src="melina_015318048.mp3">
            </audio>

        </div>


        <button onclick="surprise()">

            یه سورپرایز برات دارم ❤️

        </button>


    </div>

</div>



<script>


/* =========================
   ۲۹ مهر ۱۴۰۵
   ساعت ۰۰:۰۰
========================= */

const targetDate =
    new Date(
        "2026-10-21T00:00:00+03:30"
    ).getTime();



/* =========================
   شمارش معکوس
========================= */

function updateCountdown() {

    const now =
        new Date().getTime();


    const distance =
        targetDate - now;


    /* وقتی زمان تمام شد */

    if (distance <= 0) {

        document
            .getElementById("countdownScreen")
            .style.display = "none";


        document
            .getElementById("mainContent")
            .style.display = "block";


        return;
    }


    /* محاسبه زمان */

    const days =
        Math.floor(
            distance /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (
                distance %
                (1000 * 60 * 60 * 24)
            ) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (
                distance %
                (1000 * 60 * 60)
            ) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (
                distance %
                (1000 * 60)
            ) /
            1000
        );


    /* نمایش اعداد */

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");


    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

}


/* اجرای اولیه */

updateCountdown();


/* آپدیت هر ثانیه */

setInterval(
    updateCountdown,
    1000
);



/* =========================
   قلب‌های سورپرایز
========================= */

function surprise() {

    for (
        let i = 0;
        i < 60;
        i++
    ) {

        const heart =
            document.createElement("div");


        heart.textContent = "❤️";


        heart.className =
            "falling-heart";


        heart.style.left =
            Math.random() * 100 + "vw";


        heart.style.fontSize =
            (
                20 +
                Math.random() * 25
            ) + "px";


        heart.style.animationDuration =
            (
                3 +
                Math.random() * 3
            ) + "s";


        heart.style.animationDelay =
            Math.random() * 2 + "s";


        document.body.appendChild(heart);


        setTimeout(
            function() {

                heart.remove();

            },
            7000
        );

    }

}

</script>


</body>

    </html>
