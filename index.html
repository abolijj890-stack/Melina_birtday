<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تولد ملینا ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffe6f0;
            font-family: sans-serif;
            overflow-x: hidden;
            text-align: center;
        }


        /* =========================
           صفحه شمارش معکوس
        ========================= */

        #countdownScreen {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle,
                    #fff5f8 0%,
                    #ffe6f0 60%,
                    #ffd6e5 100%
                );

            z-index: 9999;
        }


        #countdown {

            display: flex;

            direction: rtl;

            justify-content: center;

            align-items: center;

            gap: 10px;

            padding: 15px;

            width: 100%;
        }


        /* =========================
           هر قسمت شمارش
        ========================= */

        .count-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;
        }


        /* =========================
           باکس عدد
        ========================= */

        .count-box {

            width: 75px;

            height: 90px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                rgba(255, 255, 255, 0.8);

            border-radius: 20px;

            border:
                1px solid
                rgba(255, 255, 255, 0.9);

            box-shadow:
                0 10px 30px
                rgba(233, 30, 99, 0.15);

            backdrop-filter: blur(10px);

            animation:
                floating 2s ease-in-out infinite;
        }


        .count-box span {

            display: block;

            font-size: 34px;

            font-weight: bold;

            color: #e91e63;

            direction: ltr;
        }


        /* نوشته زیر باکس */

        .count-item small {

            color: #ad1457;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           انیمیشن تایمر
        ========================= */

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }


        /* =========================
           محتوای اصلی
        ========================= */

        #mainContent {

            display: none;
        }


        .card {

            background: white;

            width: 85%;

            max-width: 500px;

            margin: 50px auto;

            padding: 30px;

            border-radius: 25px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);
        }


        h1 {

            color: #e91e63;

            font-size: 35px;
        }


        h2 {

            color: #ad1457;
        }


        p {

            color: #444;

            font-size: 18px;

            line-height: 1.8;
        }


        /* =========================
           قلب‌های شناور
        ========================= */

        .heart {

            position: fixed;

            bottom: -50px;

            font-size: 25px;

            animation:
                floatHeart 5s linear infinite;

            pointer-events: none;
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-100vh);

                opacity: 0;
            }

        }


        /* =========================
           قلب‌های سورپرایز
        ========================= */

        .falling-heart {

            position: fixed;

            top: -50px;

            font-size: 30px;

            animation:
                fallHeart 4s linear forwards;

            z-index: 999;

            pointer-events: none;
        }


        @keyframes fallHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================
           دکمه
        ========================= */

        button {

            background: #e91e63;

            color: white;

            border: none;

            padding: 15px 25px;

            border-radius: 30px;

            font-size: 18px;

            cursor: pointer;

            margin-top: 20px;

            transition: 0.2s;
        }


        button:active {

            transform: scale(0.95);
        }


        button:hover {

            box-shadow:
                0 8px 20px
                rgba(233, 30, 99, 0.3);
        }


        /* =========================
           ویس
        ========================= */

        #audioBox {

            margin-top: 25px;
        }


        audio {

            width: 100%;
        }


        /* =========================
           موبایل
        ========================= */

        @media (max-width: 400px) {

            #countdown {

                gap: 6px;

                padding: 8px;
            }


            .count-box {

                width: 65px;

                height: 80px;

                border-radius: 17px;
            }


            .count-box span {

                font-size: 29px;
            }


            .count-item small {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         شمارش معکوس
    ========================= -->

    <div id="countdownScreen">


        <div id="countdown">


            <div class="count-item">

                <div class="count-box">

                    <span id="days">۰۰</span>

                </div>

                <small>روز</small>

            </div>


            <div class="count-item">

                <div class="count-box">

                    <span id="hours">۰۰</span>

                </div>

                <small>ساعت</small>

            </div>


            <div class="count-item">

                <div class="count-box">

                    <span id="minutes">۰۰</span>

                </div>

                <small>دقیقه</small>

            </div>


            <div class="count-item">

                <div class="count-box">

                    <span id="seconds">۰۰</span>

                </div>

                <small>ثانیه</small>

            </div>


        </div>

    </div>



    <!-- =========================
         صفحه تولد
    ========================= -->

    <div id="mainContent">


        <div class="heart">❤️</div>

        <div class="heart">💗</div>

        <div class="heart">💕</div>

        <div class="heart">💖</div>


        <div class="card">


            <h1>
                تولدت مبارک ملینا ❤️
            </h1>


            <h2>
                تو قشنگ ترین اتفاق زندگی منی
            </h2>


            <p>

                امروز فقط یک روز معمولی نیست؛

                <br>

                روزیه که بهترین آدم زندگیم
                به دنیا اومد. ❤️

            </p>


            <div id="audioBox">

                <p>
                    اینم چیزی که برای تو گذاشتم ❤️🎧
                </p>

                <audio
                    controls
                    src="melina_015318048.mp3">
                </audio>

            </div>


            <button onclick="surprise()">

                یه سورپرایز برات دارم ❤️

            </button>


        </div>

    </div>



    <script>


        /* =========================
           تاریخ ۲۹ مهر ۱۴۰۵
           ساعت ۰۰:۰۰
        ========================= */

        const targetDate =
            new Date(
                "2026-10-21T00:00:00+03:30"
            ).getTime();



        /* =========================
           تبدیل اعداد به فارسی
        ========================= */

        function persian(number) {

            return String(number)
                .padStart(2, "0")
                .replace(
                    /\d/g,
                    function(digit) {

                        return "۰۱۲۳۴۵۶۷۸۹"[digit];

                    }
                );

        }



        /* =========================
           بروزرسانی شمارش
        ========================= */

        function updateCountdown() {

            const now =
                new Date().getTime();


            const distance =
                targetDate - now;



            /* وقتی شمارش تمام شد */

            if (distance <= 0) {

                document
                    .getElementById(
                        "countdownScreen"
                    )
                    .style.display = "none";


                document
                    .getElementById(
                        "mainContent"
                    )
                    .style.display = "block";


                return;
            }



            /* محاسبه روز */

            const days =
                Math.floor(
                    distance /
                    (1000 * 60 * 60 * 24)
                );



            /* محاسبه ساعت */

            const hours =
                Math.floor(
                    (
                        distance %
                        (1000 * 60 * 60 * 24)
                    )
                    /
                    (1000 * 60 * 60)
                );



            /* محاسبه دقیقه */

            const minutes =
                Math.floor(
                    (
                        distance %
                        (1000 * 60 * 60)
                    )
                    /
                    (1000 * 60)
                );



            /* محاسبه ثانیه */

            const seconds =
                Math.floor(
                    (
                        distance %
                        (1000 * 60)
                    )
                    /
                    1000
                );



            /* قرار دادن اعداد */

            document
                .getElementById("days")
                .textContent =
                persian(days);


            document
                .getElementById("hours")
                .textContent =
                persian(hours);


            document
                .getElementById("minutes")
                .textContent =
                persian(minutes);


            document
                .getElementById("seconds")
                .textContent =
                persian(seconds);

        }



        /* اجرای فوری */

        updateCountdown();


        /* آپدیت هر ثانیه */

        setInterval(
            updateCountdown,
            1000
        );



        /* =========================
           سورپرایز قلب‌ها
        ========================= */

        function surprise() {

            for (
                let i = 0;
                i < 60;
                i++
            ) {

                const heart =
                    document.createElement("div");


                heart.textContent = "❤️";


                heart.className =
                    "falling-heart";


                heart.style.left =
                    Math.random() * 100 +
                    "vw";


                heart.style.fontSize =
                    (
                        20 +
                        Math.random() * 25
                    ) +
                    "px";


                heart.style.animationDuration =
                    (
                        3 +
                        Math.random() * 3
                    ) +
                    "s";


                heart.style.animationDelay =
                    Math.random() * 2 +
                    "s";


                document
                    .body
                    .appendChild(heart);


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    7000
                );

            }

        }

    </script>


</body>

                                           </html>
