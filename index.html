<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>برای ملینا ❤️</title>


<style>

/* =========================
   تنظیمات اصلی
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #ffe6f0;

    font-family: sans-serif;

    text-align: center;

    overflow-x: hidden;
}


/* =========================
   صفحه شمارش معکوس
========================= */

#countdownScreen {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            #fff5f9,
            #ffe0ec
        );

    z-index: 9999;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}


#countdownScreen.hide {

    opacity: 0;

    transform: scale(1.5);

    pointer-events: none;
}


#countdown {

    display: flex;

    direction: rtl;

    justify-content: center;

    align-items: center;

    gap: 10px;
}


.count-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;
}


.count-box {

    width: 75px;

    height: 90px;

    display: flex;

    justify-content: center;

    align-items: center;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 10px 35px
        rgba(233, 30, 99, 0.18);

    animation:
        floating 2s ease-in-out infinite;
}


.count-box span {

    font-size: 34px;

    font-weight: bold;

    color: #e91e63;
}


.count-item small {

    color: #ad1457;

    font-size: 14px;

    font-weight: bold;
}


@keyframes floating {

    0%, 100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-6px);

    }

}


/* =========================
   صفحه تولد
========================= */

#mainContent {

    display: none;

    min-height: 100vh;

    padding-top: 30px;

    animation:
        pageAppear 2s ease forwards;
}


@keyframes pageAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.8);

    }

    100% {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================
   کارت
========================= */

.card {

    position: relative;

    background:
        rgba(255,255,255,0.96);

    width: 88%;

    max-width: 500px;

    margin: 40px auto;

    padding: 35px 25px;

    border-radius: 30px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,0.15);

    overflow: hidden;
}


/* =========================
   عنوان
========================= */

h1 {

    color: #e91e63;

    font-size: 35px;

    margin-bottom: 15px;

    animation:
        titleAppear 2s ease 1s both;
}


h2 {

    color: #ad1457;

    animation:
        titleAppear 2s ease 1.5s both;
}


p {

    color: #444;

    font-size: 18px;

    line-height: 1.8;
}


@keyframes titleAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================
   بخش سورپرایز ویس
========================= */

#audioBox {

    margin-top: 25px;

    display: none;

}


/* وقتی سورپرایز فعال شد */

#audioBox.show {

    display: block;

    animation:
        surpriseAppear 1.2s ease forwards;
}


@keyframes surpriseAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.5)
            translateY(30px);

    }

    60% {

        transform:
            scale(1.08)
            translateY(-5px);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

    }

}


/* =========================
   نوشته عاشقتم بچه
========================= */

.love-title {

    color: #e91e63;

    font-size: 30px;

    font-weight: bold;

    margin-bottom: 15px;

    text-shadow:
        0 3px 12px
        rgba(233,30,99,0.2);
}


/* =========================
   ویس
========================= */

audio {

    width: 100%;
}


/* =========================
   دکمه
========================= */

button {

    background:
        linear-gradient(
            135deg,
            #e91e63,
            #ff4f91
        );

    color: white;

    border: none;

    padding: 16px 28px;

    border-radius: 35px;

    font-size: 18px;

    cursor: pointer;

    margin-top: 20px;

    box-shadow:
        0 8px 25px
        rgba(233,30,99,0.3);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}


button:active {

    transform:
        scale(0.92);

}


button:hover {

    transform:
        scale(1.05);
}


/* =========================
   قلب‌های شناور
========================= */

.heart {

    position: fixed;

    bottom: -50px;

    font-size: 25px;

    animation:
        floatHeart 6s linear infinite;

    pointer-events: none;
}


@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    100% {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;

    }

}


/* =========================
   بارش قلب
========================= */

.falling-heart {

    position: fixed;

    top: -60px;

    font-size: 30px;

    animation:
        fallHeart 4s linear forwards;

    z-index: 9999;

    pointer-events: none;
}


@keyframes fallHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(0.5);

        opacity: 0;

    }

    10% {

        opacity: 1;

    }

    100% {

        transform:
            translateY(115vh)
            rotate(360deg)
            scale(1.2);

        opacity: 0;

    }

}


/* =========================
   قلب هنگام لمس
========================= */

.tap-heart {

    position: fixed;

    font-size: 25px;

    pointer-events: none;

    z-index: 10000;

    animation:
        tapHeart 1s ease-out forwards;
}


@keyframes tapHeart {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0.3);

        opacity: 1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);

        opacity: 0;

    }

}


/* =========================
   متن پایین
========================= */

.love-note {

    margin-top: 25px;

    color: #c2185b;

    font-size: 15px;

    opacity: 0;

    animation:
        fadeIn 2s ease 3s forwards;
}


@keyframes fadeIn {

    to {

        opacity: 1;

    }

}


/* =========================
   موبایل
========================= */

@media (max-width: 400px) {

    #countdown {

        gap: 5px;

    }

    .count-box {

        width: 65px;

        height: 80px;

    }

    .count-box span {

        font-size: 28px;

    }

    .count-item small {

        font-size: 11px;

    }

    h1 {

        font-size: 30px;

    }

    .love-title {

        font-size: 26px;

    }

}

</style>

</head>


<body>


<!-- =========================
     شمارش معکوس
========================= -->

<div id="countdownScreen">

    <div id="countdown">


        <div class="count-item">

            <div class="count-box">

                <span id="days">
                    00
                </span>

            </div>

            <small>
                روز
            </small>

        </div>


        <div class="count-item">

            <div class="count-box">

                <span id="hours">
                    00
                </span>

            </div>

            <small>
                ساعت
            </small>

        </div>


        <div class="count-item">

            <div class="count-box">

                <span id="minutes">
                    00
                </span>

            </div>

            <small>
                دقیقه
            </small>

        </div>


        <div class="count-item">

            <div class="count-box">

                <span id="seconds">
                    00
                </span>

            </div>

            <small>
                ثانیه
            </small>

        </div>

    </div>

</div>



<!-- =========================
     صفحه تولد
========================= -->

<div id="mainContent">


    <!-- قلب‌های دائمی -->

    <div class="heart">
        ❤️
    </div>

    <div class="heart">
        💗
    </div>

    <div class="heart">
        💕
    </div>

    <div class="heart">
        💖
    </div>



    <div class="card">


        <h1>
            تولدت مبارک ملینا ❤️
        </h1>


        <h2>
            تو قشنگ‌ترین اتفاق زندگی منی
        </h2>


        <p>

            امروز فقط یک روز معمولی نیست؛

            <br>

            روزیه که بهترین آدم زندگیم
            به دنیا اومد. ❤️

        </p>



        <!-- =========================
             دکمه سورپرایز
        ========================= -->

        <button
            id="surpriseButton"
            onclick="surprise()">

            کلیک کن یه سورپرایز برات دارم ❤️

        </button>



        <!-- =========================
             ویس مخفی
        ========================= -->

        <div id="audioBox">


            <div class="love-title">

                عاشقتم بچه ❤️

            </div>


            <audio
                id="loveAudio"
                controls
                src="melina_015318048.mp3">

            </audio>


        </div>



        <div class="love-note">

            بعضی آدما فقط وارد زندگی آدم نمی‌شن...

            <br>

            تبدیل می‌شن به قشنگ‌ترین قسمتِ زندگی. ❤️

        </div>


    </div>

</div>



<script>


/* =================================
   تاریخ اصلی تولد
   ۲۹ مهر ۱۴۰۵
================================= */

const realBirthday =
    new Date(
        "2026-10-21T00:00:00+03:30"
    ).getTime();



/* =================================
   حالت تست

   ?test=1
================================= */

const testMode =
    new URLSearchParams(
        window.location.search
    ).get("test") === "1";


let targetDate;


if (testMode) {

    targetDate =
        new Date().getTime() + 5000;

} else {

    targetDate =
        realBirthday;

}


let birthdayOpened = false;



/* =================================
   شمارش معکوس
================================= */

function updateCountdown() {


    const now =
        new Date().getTime();


    const distance =
        targetDate - now;


    if (distance <= 0) {

        openBirthday();

        return;

    }


    const days =
        Math.floor(
            distance /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (
                distance %
                (1000 * 60 * 60 * 24)
            ) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (
                distance %
                (1000 * 60 * 60)
            ) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (
                distance %
                (1000 * 60)
            ) /
            1000
        );


    document.getElementById(
        "days"
    ).textContent =
        String(days)
        .padStart(2, "0");


    document.getElementById(
        "hours"
    ).textContent =
        String(hours)
        .padStart(2, "0");


    document.getElementById(
        "minutes"
    ).textContent =
        String(minutes)
        .padStart(2, "0");


    document.getElementById(
        "seconds"
    ).textContent =
        String(seconds)
        .padStart(2, "0");

}



/* =================================
   باز شدن صفحه تولد
================================= */

function openBirthday() {


    if (birthdayOpened)
        return;


    birthdayOpened = true;


    const screen =
        document.getElementById(
            "countdownScreen"
        );


    screen.classList.add("hide");


    setTimeout(function() {


        screen.style.display =
            "none";


        document.getElementById(
            "mainContent"
        ).style.display =
            "block";


        massiveHearts();


    }, 1300);

}



/* =================================
   بارش بزرگ قلب
================================= */

function massiveHearts() {


    for (
        let i = 0;
        i < 100;
        i++
    ) {


        setTimeout(function() {


            const heart =
                document.createElement(
                    "div"
                );


            const hearts = [

                "❤️",
                "💗",
                "💕",
                "💖",
                "💓",
                "💘"

            ];


            heart.textContent =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.className =
                "falling-heart";


            heart.style.left =
                Math.random() * 100 +
                "vw";


            heart.style.fontSize =
                (
                    20 +
                    Math.random() * 30
                ) + "px";


            heart.style.animationDuration =
                (
                    3 +
                    Math.random() * 3
                ) + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(function() {

                heart.remove();

            }, 7000);


        }, i * 35);

    }

}



/* =================================
   دکمه سورپرایز
================================= */

function surprise() {


    const audioBox =
        document.getElementById(
            "audioBox"
        );


    const button =
        document.getElementById(
            "surpriseButton"
        );


    const audio =
        document.getElementById(
            "loveAudio"
        );


    /*
       ویس ظاهر شود
    */

    audioBox.classList.add("show");


    /*
       دکمه مخفی شود
       تا سورپرایز دوباره زده نشود
    */

    button.style.display =
        "none";


    /*
       بارش قلب
    */

    for (
        let i = 0;
        i < 80;
        i++
    ) {


        setTimeout(function() {


            const heart =
                document.createElement(
                    "div"
                );


            heart.textContent =
                "❤️";


            heart.className =
                "falling-heart";


            heart.style.left =
                Math.random() * 100 +
                "vw";


            heart.style.fontSize =
                (
                    20 +
                    Math.random() * 30
                ) + "px";


            heart.style.animationDuration =
                (
                    3 +
                    Math.random() * 3
                ) + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(function() {

                heart.remove();

            }, 7000);


        }, i * 25);

    }


    /*
       تلاش برای پخش ویس

       اگر مرورگر اجازه ندهد،
       کنترل ویس همچنان ظاهر می‌شود.
    */

    setTimeout(function() {

        audio.play().catch(
            function() {
                // اگر مرورگر پخش خودکار را بست،
                // کاربر می‌تواند Play را بزند.
            }
        );

    }, 500);


}



/* =================================
   قلب با لمس صفحه
================================= */

document.addEventListener(
    "click",
    function(event) {


        if (!birthdayOpened)
            return;


        if (
            event.target.tagName ===
                "BUTTON" ||

            event.target.tagName ===
                "AUDIO"
        ) {

            return;

        }


        const heart =
            document.createElement(
                "div"
            );


        heart.textContent =
            "❤️";


        heart.className =
            "tap-heart";


        heart.style.left =
            event.clientX + "px";


        heart.style.top =
            event.clientY + "px";


        heart.style.setProperty(
            "--x",
            (
                Math.random() * 100 -
                50
            ) + "px"
        );


        heart.style.setProperty(
            "--y",
            (
                -80 -
                Math.random() * 80
            ) + "px"
        );


        document.body.appendChild(
            heart
        );


        setTimeout(function() {

            heart.remove();

        }, 1000);

    }
);



/* =================================
   شروع شمارش
================================= */

updateCountdown();


setInterval(
    updateCountdown,
    1000
);

</script>


</body>

    </html>
